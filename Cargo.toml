[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
dotenvy = "0.15"
ureq = { version = "3", features = ["json"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
getrandom = "0.4"
sisyphus-common = { path = "crates/common" }
# Software rendering (tiny-skia) only: the GPU renderer (wgpu) loads the
# graphics drivers into the process (LLVM, Mesa, Vulkan: about 135 MB), far
# too much for this simple window. These are iced's defaults minus wgpu.
iced = { version = "0.14", default-features = false, features = [
    "svg",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
] }

# Activity (time since the last input, the focused app), per OS. All of
# these were already compiled into the client through iced/winit.
# Windows: GetLastInputInfo, the foreground window and the process table.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# macOS: the frontmost app (NSWorkspace) and the process table (libproc).
# libc is also used on Linux and macOS for the local time zone.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
libc = "0.2"
# Linux X11: the active window and XScreenSaver idle time.
x11rb = { version = "0.13", features = ["screensaver"] }
# Linux Wayland: ext-idle-notify and wlr-foreign-toplevel.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Linux D-Bus: GNOME idle time and focus, the KDE focus script.
zbus = "5"

# The tray icon. Linux: StatusNotifierItem over D-Bus, on the zbus above
# (no GTK). Windows and macOS: the native tray icon and menu, on the
# windows-sys and objc2 versions above.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
tray-icon = { version = "0.26", default-features = false }
# Draws the logo for the tray and window icons. Already compiled in through
# iced's svg feature.
resvg = { version = "0.45", default-features = false }
