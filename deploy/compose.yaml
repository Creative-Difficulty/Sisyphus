# Production stack: Postgres, the Sisyphus server, and Caddy serving it over
# HTTPS on ports 80 and 443.
#
# Run from the repo root on the server (deploy.sh does this):
#   docker compose -f deploy/compose.yaml --env-file /opt/sisyphus/sisyphus.env up -d --build
#
# The env file (root-only, never in the repo) must set POSTGRES_PASSWORD,
# PUBLIC_URL (https://$DOMAIN), DOMAIN, HACKCLUB_CLIENT_ID and
# HACKCLUB_CLIENT_SECRET, and may set GITHUB_CLIENT_ID and
# GITHUB_CLIENT_SECRET (connecting GitHub) and REVIEWERS (Slack IDs of the
# fraud squad, comma-separated, for the review page /review).

name: sisyphus

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sisyphus
      POSTGRES_DB: sisyphus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
    volumes:
      - db:/var/lib/postgresql/data
    # Not published: only the server can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisyphus -d sisyphus"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sisyphus-server:latest
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://sisyphus:${POSTGRES_PASSWORD}@db:5432/sisyphus
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in the env file}
      HACKCLUB_CLIENT_ID: ${HACKCLUB_CLIENT_ID:-}
      HACKCLUB_CLIENT_SECRET: ${HACKCLUB_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      REVIEWERS: ${REVIEWERS:-}
    # Not published: only Caddy reaches it.
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  db:
  # Certificates and the ACME account; keep them, or Let's Encrypt rate limits may hit.
  caddy_data:
  caddy_config:
