[package]
name = "sisyphus-client"
version.workspace = true
edition.workspace = true

[features]
default = ["debug-screen"]
# The debug screen (Ctrl+D twice). Release builds from CI are made with
# --no-default-features, so users don't get it.
debug-screen = []

[dependencies]
sisyphus-common.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
iced.workspace = true
ureq.workspace = true
getrandom.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
libc.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc.workspace = true
x11rb.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
zbus.workspace = true
