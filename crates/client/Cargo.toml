[package]
name = "sisyphus-client"
version.workspace = true
edition.workspace = true

[features]
default = ["debug-screen", "cli"]
# Release builds from CI are made with --no-default-features, so users get
# neither of these: a window-only app.
# The debug screen (Ctrl+D twice).
debug-screen = []
# The command-line commands (sessions, watch, activity, track). Without
# it, Windows builds don't open a console window. `input-helper` is always
# there.
cli = []

[dependencies]
sisyphus-common.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
iced.workspace = true
ureq.workspace = true
getrandom.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
resvg.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
libc.workspace = true
tray-icon.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc.workspace = true
x11rb.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
zbus.workspace = true
ksni.workspace = true
